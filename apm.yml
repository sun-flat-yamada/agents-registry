name: agent-registry-bundle
version: 1.2.0
description: Comprehensive Agent & Skills Registry supporting Claude Plugin and APM standards. Features Harness Engineering, Code Reviewers, and full suite of Workspace/Wiki/Domain primitives.
author: sun_flat

# Canonical multi-harness deployment targets supported by APM
targets:
  - claude
  - copilot
  - cursor
  - gemini
  - agent-skills

# Primitive definitions and source-of-truth mappings
primitives:
  skills:
    - skills/code-review
    - skills/string-helpers
    - skills/wiki-ingest
    - skills/wiki-promote
    - skills/wiki-lint
    - skills/collection-builder
    - skills/meta-skill-manager
    - skills/automation-scheduler
    - skills/retrospective-harness
    - skills/update-harness
    - skills/archive-shipped-plans
    - skills/e2e-live
    - skills/make-e2e-live
    - skills/setup-app
    - skills/setup-ollama-local
    - skills/setup-relay
    - skills/setup-wizard
    - skills/cooking-coach
    - skills/library
    - skills/zenn-publisher
    - skills/presentation-deck
    - skills/storyteller
    - skills/portfolio-tracker
    - skills/billing-invoice
    - skills/edgar-sec-filings
  agents:
    - agents/code-reviewer.md
    - agents/code-review-orchestrator.md
    - agents/reviewer-effective.md
    - agents/reviewer-memory-safety.md
    - agents/reviewer-security.md
    - agents/reviewer-style-quality.md
    - agents/workspace-agent.md
    - agents/collection-architect.md
    - agents/wiki-curator.md
    - agents/retrospective-harness-agent.md
    - agents/update-harness-agent.md
    - agents/agent-personal.md
    - agents/agent-office.md
    - agents/agent-guide.md
    - agents/agent-artist.md
    - agents/agent-tutor.md
    - agents/agent-storyteller.md
    - agents/agent-accounting.md
    - agents/agent-investor.md
  prompts:
    - commands/explain.md
    - commands/code-review-subagent.md
    - commands/retrospective-harness.md
    - commands/update-harness.md
  instructions:
    - instructions/typescript-rules.md
  contexts:
    - contexts/project-structure.md
  chatmodes:
    - chatmodes/architect.md
  hooks:
    - hooks/hooks.json

dependencies:
  apm: []

mcp:
  - name: filesystem
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "."]
  - name: memory
    command: npx
    args: ["-y", "@modelcontextprotocol/server-memory"]

scripts:
  sync: powershell.exe -ExecutionPolicy Bypass -File ./scripts/sync-apm.ps1
  test: powershell.exe -ExecutionPolicy Bypass -File ./scripts/sync-apm.ps1 -VerifyOnly
