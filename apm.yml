name: agent-registry-bundle
version: 1.2.0
description: "Curated software-development Agent & Skills Registry: one best agent/skill per V-model phase slot (see registry.yml). Supports Claude Plugin and APM standards."
author: sun_flat

# Canonical multi-harness deployment targets supported by APM
targets:
  - claude
  - copilot
  - agent-skills

# Primitive definitions and source-of-truth mappings
primitives:
  skills:
    - skills/requirements-definition
    - skills/architecture-design
    - skills/detailed-design
    - skills/implementation-loop
    - skills/unit-test-tdd
    - skills/integration-test
    - skills/system-test
    - skills/acceptance-test
    - skills/webapp-testing
    - skills/retrospective-harness
    - skills/update-harness
    - skills/meta-skill-manager
  agents:
    - agents/code-explorer.agent.md
    - agents/code-architect.agent.md
    - agents/type-design-analyzer.agent.md
    - agents/code-simplifier.agent.md
    - agents/pr-test-analyzer.agent.md
    - agents/retrospective-harness-agent.agent.md
    - agents/update-harness-agent.agent.md
  prompts:
    - commands/code-review.md
    - commands/retrospective-harness.md
    - commands/update-harness.md

dependencies:
  apm: []

scripts:
  sync: powershell.exe -ExecutionPolicy Bypass -File ./scripts/sync-apm.ps1
  test: powershell.exe -ExecutionPolicy Bypass -File ./scripts/sync-apm.ps1 -VerifyOnly
